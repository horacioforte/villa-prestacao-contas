name: Supabase Keep-Alive

# Pinga a API do Supabase a cada 3 dias para evitar pausa por inatividade (plano gratuito)
on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 12:00 UTC (9:00 em Sao Paulo)
  workflow_dispatch:          # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlnYWdsamp5dmtmcHhqeHppaWZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMzE0NTAsImV4cCI6MjA5NDgwNzQ1MH0.borwoDoLvxOVBrg--avdRBFuLSXV6Zng-ZrRUYexd-M"
          STATUS=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "https://ygagljjyvkfpxjxziifd.supabase.co/rest/v1/despesas?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu: HTTP $STATUS"
          cat /tmp/resp.txt
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "::error::Supabase respondeu $STATUS - o projeto pode estar pausado. Acesse https://supabase.com/dashboard e clique em Restore project."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # O GitHub desativa workflows agendados apos 60 dias sem commits.
      # Se o ultimo commit tiver mais de 50 dias, cria um commit vazio para manter o agendamento ativo.
      - name: Manter workflow ativo
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Ultimo commit ha $DAYS dias"
          if [ $DAYS -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive do workflow agendado"
            git push
          fi
